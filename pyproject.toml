[project]
name = "bara-la-afrika-pipelines"
version = "0.1.0"
description = "Data pipelines for Bara La Afrika (PDF extraction, flags, boundaries, mountains, gold)."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "cairosvg>=2.9.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=1.28.2",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "fonttools[woff]>=4.67.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
# The `pipelines/` directory is run in place (`python -m pipelines <command>` from the repo root),
# so the project itself is not built or installed as a distribution.
package = false

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["."]
extend-exclude = ["apps", "netlify", "packages", "node_modules", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# These modules handle typographic quotes, dashes and click letters from the PDF on purpose.
"pipelines/africa_pipelines/text.py" = ["RUF001", "RUF003"]
"pipelines/africa_pipelines/report.py" = ["RUF001"]

[tool.mypy]
python_version = "3.15"
strict = true
packages = ["pipelines", "scripts"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pymupdf.*", "pdfplumber.*", "cairosvg.*", "sklearn.*", "fontTools.*"]
ignore_missing_imports = true

# PyMuPDF ships without type hints; only these thin wrappers call it directly.
[[tool.mypy.overrides]]
module = ["pipelines.africa_pipelines.pdf_reader", "pipelines.africa_pipelines.symbology_document"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["pipelines/tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
  # Third-party deprecations surfaced by Python 3.15 (PyMuPDF's SWIG bindings), not our code.
  "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
  "ignore:'typing.ByteString' and 'collections.abc.ByteString' are deprecated:DeprecationWarning",
]
