# Netlify: static site (apps/web) + serverless functions (netlify/functions).
# The Content-Security-Policy is generated at build time into apps/web/dist/_headers (it hashes
# the inline theme bootstrap script); all other headers are set here.

[build]
  command = "npm run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "vite"
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  # Not the build output (see [context.dev] below); Vite serves public/ at the site root in dev.
  publish = "apps/web/public"

# `netlify dev` runs in the "dev" context. Netlify merges `<publish>/_headers` into the config,
# and dist/_headers holds the production CSP (generated by the build), which blocks Vite's inline
# dev scripts and leaves a blank page. In dev, point publish at the source public/ folder, which
# has no _headers. Deploys use [build].publish and keep the CSP.
[context.dev]
  publish = "apps/web/public"

# API: /api/countries/KEN → /.netlify/functions/countries/KEN (functions parse the rest).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback (after real files and the API). index.html is the prerendered home page, so
# every other path without a page of its own gets the plain app (app.html, written by the build).
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# HTML: always revalidate so new deploys are picked up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Content-hashed build assets: cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Map geometry and self-hosted flag fallbacks change with data refreshes, not deploy hashes.
[[headers]]
  for = "/geo/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/flags/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
