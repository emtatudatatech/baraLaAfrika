[project]
name = "bara-la-afrika-pipelines"
version = "0.1.0"
description = "Data pipelines for Bara La Afrika (PDF extraction, flags, boundaries, mountains, gold)."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=1.28.2",
]

[dependency-groups]
dev = [
    "fonttools[woff]>=4.67.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
# The `pipelines/` directory is run in place (`python -m pipelines <command>` from the repo root),
# so the project itself is not built or installed as a distribution.
package = false

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["."]
extend-exclude = ["apps", "netlify", "packages", "node_modules", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLC0415"]

[tool.mypy]
python_version = "3.15"
strict = true
packages = ["pipelines", "scripts"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pymupdf.*", "pdfplumber.*", "cairosvg.*", "sklearn.*", "fontTools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["pipelines/tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
